[build]
  # 빌드 명령어
  command = "npm run build"
  
  # 빌드 결과물이 생성되는 디렉토리
  publish = "dist"
  
  # Node.js LTS 20 적용 (안정성 확보)
  environment = { NODE_VERSION = "20.11.1" }

# 단일 페이지(라우터 없음)이므로 SPA 리다이렉트를 두지 않는다.
# (/* → /index.html 을 두면 없는 JS/CSS 요청에도 HTML이 200으로 내려가 MIME 오류가 난다)

# 보안 헤더 설정
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS 강제 설정
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    
    # XSS 보호
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # 컨텐츠 보안 정책
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://cdn.emailjs.com
        https://t1.daumcdn.net
        https://www.googletagmanager.com;
      connect-src 'self'
        https://api.emailjs.com
        https://www.google-analytics.com
        https://www.googletagmanager.com;
      img-src 'self' data: https: https://www.google-analytics.com;
      frame-src 'self' https://t1.daumcdn.net https://postcode.map.daum.net;
    """
    
# 정적 파일 캐싱 설정
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
