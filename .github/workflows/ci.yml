name: CI

# 배포는 Netlify가 담당한다. 여기서는 린트·서식·테스트·타입 체크·빌드·취약점을 확인한다.
on:
  push:
    branches: ["master"]
  pull_request:

# PR은 새 push가 오면 이전 실행을 취소하고, master는 커밋마다 끝까지 빌드한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .nvmrc는 Netlify 운영 빌드(netlify.toml의 NODE_VERSION)와 같은 버전으로 유지
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # high 이상만 실패로 본다 (개발 도구의 moderate는 Dependabot으로 따라간다)
      - name: Audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Type-check & build
        run: npm run build
